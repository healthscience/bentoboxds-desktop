appId: org.bentoboxds.app
productName: BentoBox-DS-Desktop
buildVersion: 0.7.31
directories:
  buildResources: build
files:
  - '!build/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
extraResources: 
  [
    { 
      from: 'hop/',
      to: './hop' },
    {
      from: 'models-hop/',
      to: './models-hop'
    }
  ]
asarUnpack:
  - resources/**
win:
  executableName: bentobox-ds
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  icon: build/icon-512x512.png
  target:
    - AppImage
  maintainer: bentboxds.org
  category: Utility
mac:
  icon: build/icon.png
  target:
    - mas
  type: distribution
  minimumSystemVersion: "12.0.0"
  extendInfo:
    ElectronTeamID: "8J3898W497" # Insert your 10-character Team ID here
mas:
  artifactName: ${name}-${version}.${ext}
  provisioningProfile: build/embedded.provisionprofile
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
pkg:
  artifactName: ${name}-${version}.${ext}
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://bentoboxds.org