name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022

    permissions:
      contents: write

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GPT4ALL_SKIP_INSTALL_BACKEND: "true"
      CI: true
      GYP_MSVS_VERSION: 2022

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache hop node_modules
        uses: actions/cache@v4
        with:
          path: hop/node_modules
          key: ${{ runner.os }}-hop-${{ hashFiles('hop/package-lock.json', 'hop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-hop-

      - name: Cache renderer node_modules
        uses: actions/cache@v4
        with:
          path: src/renderer/node_modules
          key: ${{ runner.os }}-renderer-${{ hashFiles('src/renderer/package-lock.json', 'src/renderer/package.json') }}
          restore-keys: |
            ${{ runner.os }}-renderer-

      - name: Cache models-hop node_modules
        uses: actions/cache@v4
        with:
          path: models-hop/node_modules
          key: ${{ runner.os }}-models-${{ hashFiles('models-hop/package-lock.json', 'models-hop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: Install root dependencies
        run: npm ci

      - name: Install hop dependencies
        run: cd hop && npm ci

      - name: Install renderer dependencies
        working-directory: ./src/renderer
        run: npm ci

      - name: Install models-hop dependencies
        working-directory: ./models-hop
        run: npm ci

      - name: Build for Windows
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
