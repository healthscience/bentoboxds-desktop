name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GPT4ALL_SKIP_INSTALL_BACKEND: "true"
      npm_config_build_from_source: "false"
      npm_config_arch: x64
      npm_config_target_arch: x64
      CI: true

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Fix node-gyp on Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          npm install -g npm@latest
          npm install -g node-gyp@latest
          $nodeGypBin = (Get-Command node-gyp).Source
          $nodeGypDir = Split-Path -Parent $nodeGypBin
          $nodeGypJs = Join-Path $nodeGypDir "node_modules/node-gyp/bin/node-gyp.js"
          if (!(Test-Path $nodeGypJs)) {
            $globalRoot = npm root -g
            $nodeGypJs = Join-Path $globalRoot "node-gyp/bin/node-gyp.js"
          }
          echo "npm_config_node_gyp=$nodeGypJs" >> $env:GITHUB_ENV
          echo "npm_config_msvs_version=2022" >> $env:GITHUB_ENV

      - name: Cache hop node_modules
        uses: actions/cache@v4
        with:
          path: hop/node_modules
          key: ${{ runner.os }}-hop-${{ hashFiles('hop/package-lock.json', 'hop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-hop-

      - name: Cache renderer node_modules
        uses: actions/cache@v4
        with:
          path: src/renderer/node_modules
          key: ${{ runner.os }}-renderer-${{ hashFiles('src/renderer/package-lock.json', 'src/renderer/package.json') }}
          restore-keys: |
            ${{ runner.os }}-renderer-

      - name: Cache models-hop node_modules
        uses: actions/cache@v4
        with:
          path: models-hop/node_modules
          key: ${{ runner.os }}-models-${{ hashFiles('models-hop/package-lock.json', 'models-hop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: Install root dependencies
        run: npm ci

      - name: Install hop dependencies
        run: cd hop && npm ci

      - name: Install renderer dependencies
        working-directory: ./src/renderer
        run: npm ci

      - name: Install models-hop dependencies
        working-directory: ./models-hop
        run: npm ci

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsqlite3-dev
          npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.AppImage
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
