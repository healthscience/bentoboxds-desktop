name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest]

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GPT4ALL_SKIP_INSTALL_BACKEND: "true"
      CI: true

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache hop node_modules
        uses: actions/cache@v4
        with:
          path: hop/node_modules
          key: ${{ runner.os }}-hop-${{ hashFiles('hop/package-lock.json', 'hop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-hop-

      - name: Cache renderer node_modules
        uses: actions/cache@v4
        with:
          path: src/renderer/node_modules
          key: ${{ runner.os }}-renderer-${{ hashFiles('src/renderer/package-lock.json', 'src/renderer/package.json') }}
          restore-keys: |
            ${{ runner.os }}-renderer-

      - name: Cache models-hop node_modules
        uses: actions/cache@v4
        with:
          path: models-hop/node_modules
          key: ${{ runner.os }}-models-${{ hashFiles('models-hop/package-lock.json', 'models-hop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: Install root dependencies
        run: npm ci

      - name: Install hop dependencies
        run: cd hop && npm ci

      - name: Install renderer dependencies
        working-directory: ./src/renderer
        run: npm ci

      - name: Install models-hop dependencies
        working-directory: ./models-hop
        run: npm ci

      - name: Build for macOS
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # App signing pair
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Installer package signing pair
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          # Apple Store Verification
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Identify Build Artifact
        if: startsWith(github.ref, 'refs/tags/')
        id: artifact
        run: |
          echo "Searching for .pkg file..."
          PKG_PATH=$(find dist -maxdepth 2 -name "*.pkg" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: No .pkg file found in dist/"
            exit 1
          fi
          echo "Found artifact: $PKG_PATH"
          echo "path=$PKG_PATH" >> $GITHUB_OUTPUT

      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/')
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.artifact.outputs.path }}
          app-type: 'macos'
          backend: 'transporter'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.pkg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}